  const [published,setPublished] = useState(false);
  const [f,setF] = useState({ name:"", title:"", company:"", location:"", bio:"", accent:"",
                              emails:[""], phones:[""], links:[{label:"",url:""}] });
  const [leads,setLeads] = useState([]);
  const [saving,setSaving] = useState(false);
  const [msg,setMsg] = useState("");
  const [tab,setTab] = useState("edit");   // edit | share | leads

  useEffect(()=>{ let live=true;
    (async ()=>{
      try {
        const c=await getCard(cfg); if(!live) return;
        setSlug(c.slug); setPublished(!!c.published);
        const d=c.data||{};
        setF({ name:d.name||"", title:d.title||"", company:d.company||"", location:d.location||"",
          bio:d.bio||"", accent:d.accent||"",
          emails:(d.emails&&d.emails.length?d.emails:[""]),
          phones:(d.phones&&d.phones.length?d.phones:[""]),
          links:(d.links&&d.links.length?d.links:[{label:"",url:""}]) });
      } catch(e){ if(live) setMsg("Couldn't load your card."); }
      finally { if(live) setLoading(false); }
      try { const L=await getCardLeads(cfg); if(live) setLeads(L||[]); } catch(e){}
    })();
    return ()=>{ live=false; };
  },[]);  // eslint-disable-line

  function toData(){
    return { name:f.name.trim(), title:f.title.trim(), company:f.company.trim(), location:f.location.trim(),
      bio:f.bio.trim(), accent:f.accent.trim(),
      emails:f.emails.map(x=>x.trim()).filter(Boolean),
      phones:f.phones.map(x=>x.trim()).filter(Boolean),
      links:f.links.map(l=>({label:(l.label||"").trim(), url:(l.url||"").trim()})).filter(l=>l.url) };
  }
  async function save(pub){
    setSaving(true); setMsg("");
    try { const r=await saveCard(cfg, toData(), pub); setSlug(r.slug); setPublished(!!r.published);
      setMsg(pub?"Published ✓":"Saved ✓"); if(pub) setTab("share"); }
    catch(e){ setMsg("Save failed — try again."); }
    finally { setSaving(false); }
  }
  async function acceptLead(l){ onAddLead(l.data); try{ await deleteCardLead(cfg,l.id); }catch(e){} setLeads(leads.filter(x=>x.id!==l.id)); }
  async function dismissLead(l){ try{ await deleteCardLead(cfg,l.id); }catch(e){} setLeads(leads.filter(x=>x.id!==l.id)); }

  const url = slug ? cardUrl(slug) : "";
  function copyLink(){ try{ navigator.clipboard.writeText(url); setMsg("Link copied ✓"); }catch(e){} }
  function shareLink(){ if(navigator.share){ navigator.share({ title:(f.name||"My card")+" — ContactCaptain", url }).catch(()=>{}); } else copyLink(); }

  const setArr=(key,i,v)=> setF({...f, [key]: f[key].map((x,j)=> j===i?v:x) });
  const addArr=(key,blank)=> setF({...f, [key]: [...f[key], blank] });
  const rmArr=(key,i)=> setF({...f, [key]: (f[key].length>1 ? f[key].filter((_,j)=> j!==i) : f[key]) });

  return (
    <div className="overlay">
      <div className="overlay-head">
        <button className="icon-btn" onClick={onClose}>←</button>
        <b>My card</b>
        <button className="btn ghost" disabled={saving||loading} onClick={()=> save(published)}>{saving?"…":"Save"}</button>
      </div>
      <div className="seg" style={{margin:"10px 16px 0"}}>
        <button className={tab==="edit"?"on":""} onClick={()=>setTab("edit")}>Edit</button>
        <button className={tab==="share"?"on":""} onClick={()=>setTab("share")}>Share</button>
        <button className={tab==="leads"?"on":""} onClick={()=>setTab("leads")}>Connections{leads.length?(" ("+leads.length+")"):""}</button>
      </div>
      <div className="overlay-body">
        {loading ? <div className="muted">Loading…</div> : tab==="edit" ? (
          <div>
            <div className="field"><label>Name</label><input className="input" value={f.name} onChange={e=>setF({...f,name:e.target.value})} /></div>
            <div className="field"><label>Title</label><input className="input" value={f.title} onChange={e=>setF({...f,title:e.target.value})} /></div>
            <div className="field"><label>Company</label><input className="input" value={f.company} onChange={e=>setF({...f,company:e.target.value})} /></div>
            <div className="field"><label>Location</label><input className="input" value={f.location} onChange={e=>setF({...f,location:e.target.value})} /></div>
            <div className="field"><label>Bio</label><textarea className="input" rows="2" value={f.bio} onChange={e=>setF({...f,bio:e.target.value})} /></div>
            <div className="field"><label>Emails to show</label>
              {f.emails.map((e,i)=> <div key={i} className="row" style={{marginBottom:6}}>
                <input className="input" value={e} onChange={ev=>setArr("emails",i,ev.target.value)} placeholder="name@example.com" />
                <button className="icon-btn" onClick={()=>rmArr("emails",i)}>✕</button></div>)}
              <button className="btn" style={{width:"auto"}} onClick={()=>addArr("emails","")}>+ Email</button></div>
            <div className="field"><label>Phones to show</label>
              {f.phones.map((p,i)=> <div key={i} className="row" style={{marginBottom:6}}>
                <input className="input" value={p} onChange={ev=>setArr("phones",i,ev.target.value)} placeholder="phone" />
                <button className="icon-btn" onClick={()=>rmArr("phones",i)}>✕</button></div>)}
              <button className="btn" style={{width:"auto"}} onClick={()=>addArr("phones","")}>+ Phone</button></div>
            <div className="field"><label>Links</label>
              {f.links.map((l,i)=> <div key={i} className="row" style={{marginBottom:6}}>
                <input className="input" style={{flex:"0 0 32%"}} value={l.label} onChange={ev=>setArr("links",i,{...l,label:ev.target.value})} placeholder="Label" />
                <input className="input" value={l.url} onChange={ev=>setArr("links",i,{...l,url:ev.target.value})} placeholder="https://" />
                <button className="icon-btn" onClick={()=>rmArr("links",i)}>✕</button></div>)}
              <button className="btn" style={{width:"auto"}} onClick={()=>addArr("links",{label:"",url:""})}>+ Link</button></div>
            <div className="field"><label>Accent color (optional)</label>
              <input className="input" value={f.accent} onChange={e=>setF({...f,accent:e.target.value})} placeholder="#6c8cff" /></div>
            {msg && <div className="muted" style={{marginBottom:8}}>{msg}</div>}
            <button className="btn primary" disabled={saving} onClick={()=> save(true)}>{published?"Save & keep published":"Publish card"}</button>
            {published && <div className="muted" style={{textAlign:"center",marginTop:8}}>Published — see the Share tab for your link & QR.</div>}
          </div>
        ) : tab==="share" ? (
          <div style={{textAlign:"center"}}>
            {!published ? <div className="notice">Your card isn’t published yet. Publish it on the Edit tab to get a shareable link.</div>
             : !slug ? <div className="muted">Save first to get your link.</div>
             : <div>
                 <img src={qrImgUrl(url)} alt="Card QR code" style={{width:220,height:220,borderRadius:12,background:"#fff",padding:8}} />
                 <div className="muted" style={{margin:"10px 0", wordBreak:"break-all"}}>{url}</div>
                 <div className="row"><button className="btn" onClick={copyLink}>Copy link</button><button className="btn primary" onClick={shareLink}>Share</button></div>
                 <a className="btn ghost" href={url} target="_blank" rel="noreferrer" style={{display:"inline-block",marginTop:8}}>Preview card ↗</a>
                 {msg && <div className="muted" style={{marginTop:6}}>{msg}</div>}
               </div>}
          </div>
        ) : (
          <div>
            {leads.length===0
              ? <Placeholder glyph={"📇"} title="No new connections" note="When someone shares their info from your card, it lands here to review." />
              : leads.map(l=> (
                  <div key={l.id} className="card">
                    <div style={{fontWeight:600}}>{(l.data&&l.data.name)||"(no name)"}</div>
                    <div className="muted">{[l.data&&l.data.email, l.data&&l.data.phone].filter(Boolean).join(" · ")}</div>
                    {l.data&&l.data.note && <div style={{marginTop:4}}>{l.data.note}</div>}
                    <div className="row" style={{marginTop:8}}>
                      <button className="btn primary" onClick={()=>acceptLead(l)}>Add to contacts</button>
                      <button className="btn" onClick={()=>dismissLead(l)}>Dismiss</button>
                    </div>
                  </div>))}
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [cfg,setCfg] = useState(()=> loadConfig());
  const [authed,setAuthed] = useState(()=>{ const c=loadConfig(); return configComplete(c) || !!c.offline; });
  const [tab,setTab] = useState("home");
  const [data,setData] = useState(()=> loadCache() || emptyData());
  const [toast,setToast] = useState("");
  // PWA self-update: { ver, build } of a newer deployed build, else null.
  const [update,setUpdate] = useState(null);
  const [updMsg,setUpdMsg] = useState("");   // inline status for the Settings "Check for updates" row
  const updTimer = useRef(null);
  const loadedOnce = useRef(false);

  const [overlay,setOverlay] = useState(null);

  function flash(msg){ setToast(msg); setTimeout(()=> setToast(""), 2600); }
  function applyCfg(next){ setCfg(next); saveConfig(next); }

  // Settings is reached via the topbar gear (nav standard 2026-07-24), and the
  // back arrow returns to whichever tab you came from.
  const prevTab = useRef("home");
  function openSettings(){ if(tab!=="settings"){ prevTab.current = tab; setTab("settings"); } }
  function closeSettings(){
    const t = prevTab.current || "home";
    // if Deals was toggled off while in Settings, don't return to a hidden tab
    setTab(t==="deals" && !cfg.dealsEnabled ? "home" : t);
  }

  /* ---- push resilience -------------------------------------------------
     Saving is optimistic: local state + localStorage first, then a PUT. A PUT can fail
     (offline, expired token, backend blip) and the old code only WARN-logged it, so a
     save could be silently lost while the UI still looked clean.
     Now every save parks the collection's latest bytes in `unsentRef` until its PUT
     lands, we retry on the next save / `online` / tab-visible, and anything still
     unsent is shown as a problem. The invariant: a failed push never reads as synced.
     Deliberately NOT a per-record dirty-flag engine - collections are pushed whole,
     so the last payload for a collection is all the state a retry needs. */
  const unsentRef = useRef({});          // { collectionName: latest payload not yet confirmed }
  const flushingRef = useRef(false);
  const cfgRef = useRef(cfg);
  cfgRef.current = cfg;
  const [unsent,setUnsent] = useState(0);   // collections currently unconfirmed (drives the UI)
  const [pushing,setPushing] = useState(false);

  const flushUnsent = useCallback(async ()=>{
    if (flushingRef.current) return;
    const c = cfgRef.current;
    if (!configComplete(c) || !Object.keys(unsentRef.current).length) return;
    flushingRef.current = true; setPushing(true);
    try {
      // A save made mid-flush lands in unsentRef after its name was read, so do a second
      // pass; bounded so a hot loop can't spin. A failure stops us until the next trigger.
      for (let pass=0; pass<3; pass++){
        const names = Object.keys(unsentRef.current);
        if (!names.length) break;
        let failed = false;
        for (const name of names){
          const payload = unsentRef.current[name];
          try {
            await putCollection(c, name, payload);
            // only clear if this is still the newest payload for that collection
            if (unsentRef.current[name] === payload) delete unsentRef.current[name];
          } catch(e){ failed = true; logMsg("WARN","push "+name+": "+(e&&e.message)); }
        }
        if (failed) break;
      }
    } finally {
      flushingRef.current = false; setPushing(false);
      setUnsent(Object.keys(unsentRef.current).length);
    }
  },[]);

  // Retry triggers: back online, tab brought forward. (The third - "on the next save" -
  // is saveCollection itself, which routes every push through flushUnsent.)
  useEffect(()=>{
    const onOnline = ()=> flushUnsent();
    const onVis = ()=>{ if(document.visibilityState==="visible") flushUnsent(); };
    window.addEventListener("online", onOnline);
    document.addEventListener("visibilitychange", onVis);
    return ()=>{ window.removeEventListener("online", onOnline); document.removeEventListener("visibilitychange", onVis); };
  },[flushUnsent]);

  // Persist a whole collection: optimistic local + cache, then push to backend.
  function saveCollection(name, next){
    setData(d=>{ const nd={...d, [name]:next}; saveCache(nd); return nd; });
    if (!configComplete(cfg)) return;   // offline/local-only mode has nowhere to push
    unsentRef.current[name] = next;
    setUnsent(Object.keys(unsentRef.current).length);
    flushUnsent();
  }
  function ensureOrg(name){
    const nm=(name||"").trim(); if(!nm) return null;
    const existing=(data.organizations||[]).find(o=> (o.name||"").toLowerCase()===nm.toLowerCase());
    if (existing) return existing.id;
    const o={ id:uid("org"), name:nm, type:"", website:"", location:"", tags:[], notes:"", created_at:todayISO(), updated_at:todayISO() };
    saveCollection("organizations", [o, ...(data.organizations||[])]);
    return o.id;
  }
  function upsertContact(c){
    const arr=data.contacts||[]; const i=arr.findIndex(x=>x.id===c.id);
    saveCollection("contacts", i>=0 ? arr.map(x=> x.id===c.id?c:x) : [c, ...arr]);
  }
  function deleteContact(id){ saveCollection("contacts", (data.contacts||[]).filter(x=>x.id!==id)); }
  function upsertOrg(o){
    const arr=data.organizations||[]; const i=arr.findIndex(x=>x.id===o.id);
    saveCollection("organizations", i>=0 ? arr.map(x=> x.id===o.id?o:x) : [o, ...arr]);
  }
  function deleteOrg(id){ saveCollection("organizations", (data.organizations||[]).filter(x=>x.id!==id)); }

  // Accept a digital-card "connection" (lead) into contacts, tagged by source.
  function addLeadContact(d){
    d = d || {};
    const c = { id:uid("c"), name:(d.name||"").trim()||"(no name)",
      emails: d.email?[d.email]:[], phones: d.phone?[d.phone]:[], org_id:null,
      title:"", location:"", tags:["Met via card"], how_we_met:"Digital business card",
      birthday:"", notes:(d.note||""), cadence_days:null, last_interaction_at:null,
      reachout_snooze_until:null, birthday_ack:null, created_at:todayISO(), updated_at:todayISO() };
    upsertContact(c);
    flash("Added to contacts");
  }

  function onSaveContact(form){
    const base = (overlay && overlay.contact) || {};
    const org_id = ensureOrg(form.orgName);
    const c = {
      id: base.id || uid("c"),
      name:form.name, emails:form.emails, phones:form.phones, org_id,
      title:form.title, location:form.location, tags:form.tags,
      how_we_met:form.how_we_met, birthday:form.birthday, notes:form.notes,
      cadence_days:form.cadence_days,
      last_interaction_at: base.last_interaction_at || null,
      // carried through an edit so dismissed Home reminders don't silently come back
      reachout_snooze_until: base.reachout_snooze_until || null,
      birthday_ack: base.birthday_ack || null,
      created_at: base.created_at || todayISO(), updated_at: todayISO(),
    };
    upsertContact(c);
    setOverlay({ type:"contactDetail", id:c.id });
  }
  function onSaveOrg(form){
    const base = (overlay && overlay.org) || {};
    const o = { id: base.id || uid("org"), name:form.name, type:form.type, website:form.website,
      location:form.location, tags:form.tags, notes:form.notes,
      created_at: base.created_at || todayISO(), updated_at: todayISO() };
    upsertOrg(o);
    setOverlay({ type:"orgDetail", id:o.id });
  }

  // Interactions + follow-up tasks (Phase 3).
  function saveInteraction(contactId, interaction, form){
    const base = interaction || {};
    const it = { id: base.id || uid("i"), contact_id:contactId, type:form.type, date:form.date,
      note:form.note, created_at: base.created_at || todayISO() };
    const arr = data.interactions || []; const i = arr.findIndex(x=> x.id===it.id);
    saveCollection("interactions", i>=0 ? arr.map(x=> x.id===it.id?it:x) : [it, ...arr]);
    const c = (data.contacts||[]).find(x=> x.id===contactId);
    if (c){ const last = maxDate(c.last_interaction_at, it.date);
      if (last !== c.last_interaction_at) upsertContact({ ...c, last_interaction_at:last, updated_at:todayISO() }); }
  }
  function deleteInteraction(id){ saveCollection("interactions", (data.interactions||[]).filter(x=> x.id!==id)); }
  function quickLog(contactId){ saveInteraction(contactId, null, { type:"note", date:todayISO(), note:"Reached out" }); flash("Logged"); }

  // Home's reminder rows are VIEWS of a contact, so their swipe dismisses the reminder -
  // it never deletes the person (that lives on the contact detail screen only).
  // Reach-out: push the next due date one full cadence out, without logging a fake interaction.
  function dismissReachOut(id){
    const c=(data.contacts||[]).find(x=> x.id===id); if(!c) return;
    const until = addDays(todayISO(), c.cadence_days || 30);
    upsertContact({ ...c, reachout_snooze_until: until, updated_at: todayISO() });
    flash("Reminder dismissed");
  }
  // Birthday: remember THIS year's occurrence date; the row returns once that date passes.
  function dismissBirthday(id){
    const c=(data.contacts||[]).find(x=> x.id===id); if(!c) return;
    const next = nextBirthdayISO(c.birthday); if(!next) return;
    upsertContact({ ...c, birthday_ack: next, updated_at: todayISO() });
    flash("Birthday reminder dismissed");
  }
  function addTask(contactId, title, due_date){
    const t = { id:uid("t"), contact_id:contactId, title, due_date:due_date||null, done:false, created_at:todayISO() };
    saveCollection("tasks", [t, ...(data.tasks||[])]);
  }
  function toggleTask(id){ saveCollection("tasks", (data.tasks||[]).map(t=> t.id===id ? {...t, done:!t.done} : t)); }
  function deleteTask(id){ saveCollection("tasks", (data.tasks||[]).filter(t=> t.id!==id)); }

  // Deals (optional layer).
  function upsertDeal(d){
    const arr=data.deals||[]; const i=arr.findIndex(x=>x.id===d.id);
    saveCollection("deals", i>=0 ? arr.map(x=> x.id===d.id?d:x) : [d, ...arr]);
  }
  function deleteDeal(id){ saveCollection("deals", (data.deals||[]).filter(x=> x.id!==id)); }
  function setDealStage(id, stage){ saveCollection("deals", (data.deals||[]).map(x=> x.id===id ? {...x, stage, updated_at:todayISO()} : x)); }
  function onSaveDeal(form){
    const base = (overlay && overlay.deal) || {};
    const contact = (data.contacts||[]).find(c=> (c.name||"").toLowerCase()===(form.contactName||"").trim().toLowerCase());
    const org_id = form.orgName ? ensureOrg(form.orgName) : null;
    const d = { id: base.id || uid("d"), title:form.title, value:form.value, stage:form.stage,
      contact_id: contact ? contact.id : null, org_id,
      expected_close: form.expected_close || null, notes:form.notes,
      created_at: base.created_at || todayISO(), updated_at: todayISO() };
    upsertDeal(d);
    setOverlay({ type:"dealDetail", id:d.id });
  }

  // AI (lightweight, via the backend relay). Needs a real signed-in session.
  function aiReady(){ if(!configComplete(cfg)){ flash("AI works once you're signed in to the backend"); return false; } return true; }
  function summarizeContact(c){
    if(!aiReady()) return;
    const ix = (data.interactions||[]).filter(x=> x.contact_id===c.id)
      .slice().sort((a,b)=> (a.date||"").localeCompare(b.date||""));
    const lines = ix.map(i=> i.date+" — "+ITypeLabel(i.type)+(i.note?(": "+i.note):"")).join("\n");
    const sys = "You summarize a personal relationship history in 2-3 sentences, then suggest one natural next step. Warm and concise.";
    const user = "Contact: "+c.name+(c.title?(", "+c.title):"")+"\nNotes: "+(c.notes||"-")+"\n\nInteractions:\n"+(lines||"(none logged yet)");
    setOverlay({ type:"ai", title:"Summary — "+c.name,
      run: ()=> aiRelay(cfg, { task:"summarize_contact", system:sys, messages:[{role:"user", content:user}], max_tokens:400 }) });
  }
  function draftMessage(c){
    if(!aiReady()) return;
    const sys = "You write a short, warm, natural check-in message to reconnect with someone. Output only the message — no preamble, no quotes.";
    const ctx = "Recipient: "+c.name+"\nHow we met / context: "+(c.how_we_met||"-")+"\nNotes: "+(c.notes||"-")+"\nLast contacted: "+(c.last_interaction_at||"a while ago");
    setOverlay({ type:"ai", title:"Draft for "+c.name,
      run: ()=> aiRelay(cfg, { task:"draft_message", system:sys, messages:[{role:"user", content:ctx}], max_tokens:300 }) });
  }

  // Apply a reviewed contact import (Phase 6). Batches orgs + contacts into one save each.
  function applyImport(rows){
    let contacts=[...(data.contacts||[])];
    let orgs=[...(data.organizations||[])];
    const orgByName=new Map(orgs.map(o=>[(o.name||"").toLowerCase(), o]));
    function ensureOrgLocal(name){
      const nm=(name||"").trim(); if(!nm) return null;
      const ex=orgByName.get(nm.toLowerCase()); if(ex) return ex.id;
      const o={ id:uid("org"), name:nm, type:"", website:"", location:"", tags:[], notes:"", created_at:todayISO(), updated_at:todayISO() };
      orgs=[o,...orgs]; orgByName.set(nm.toLowerCase(), o); return o.id;
    }
    const byId=new Map(contacts.map(c=>[c.id,c]));
    let added=0, mergedN=0;
    for(const r of rows){
      if(!r.include) continue;
      const org_id=ensureOrgLocal(r.draft.orgName);
      if(r.target && byId.has(r.target)){
        const ex=byId.get(r.target);
        const upd={ ...ex,
          emails:uniqBy([...(ex.emails||[]), ...r.draft.emails], emailKey),
          phones:uniqBy([...(ex.phones||[]), ...r.draft.phones], phoneKey),
          org_id: ex.org_id||org_id, title: ex.title||r.draft.title, location: ex.location||r.draft.location,
          birthday: ex.birthday||r.draft.birthday, notes: ex.notes||r.draft.notes, name: ex.name||r.draft.name,
          updated_at: todayISO() };
        contacts=contacts.map(c=> c.id===ex.id?upd:c); byId.set(ex.id, upd); mergedN++;
      } else {
        const c={ id:uid("c"), name:r.draft.name||"(no name)", emails:r.draft.emails, phones:r.draft.phones,
          org_id, title:r.draft.title||"", location:r.draft.location||"", tags:[], how_we_met:"",
          birthday:r.draft.birthday||"", notes:r.draft.notes||"", cadence_days:null, last_interaction_at:null,
          created_at:todayISO(), updated_at:todayISO() };
        contacts=[c, ...contacts]; byId.set(c.id, c); added++;
      }
    }
    saveCollection("contacts", contacts);
    saveCollection("organizations", orgs);
    setOverlay(null);
    flash("Imported "+added+" new"+(mergedN?(" · merged "+mergedN):""));
  }

  // Service worker registration + version check.
  useEffect(()=>{
    if (!("serviceWorker" in navigator)) return;
    const onLoad = ()=> navigator.serviceWorker.register("/sw.js")
      .then(()=> logMsg("SW","registered")).catch(e=> logMsg("WARN","SW register: "+(e&&e.message)));
    if (document.readyState==="complete") onLoad();
    else window.addEventListener("load", onLoad);
    return ()=> window.removeEventListener("load", onLoad);
  },[]);

  // --- PWA self-update: detect a newer deployed build and offer a one-tap refresh ---
  // Installed PWAs cache the HTML hard; this fetches the deployed file fresh, reads its
  // BUILD stamp, and surfaces a banner when a genuinely newer build is live.
  // Show a status line for a few seconds then clear it (used for terminal results).
  const flashUpd = useCallback((msg)=>{ setUpdMsg(msg); if(updTimer.current) clearTimeout(updTimer.current); updTimer.current = setTimeout(()=>setUpdMsg(""), 4000); },[]);
  // manual=true is the Settings button: show inline "Checking..." then a result. On
  // launch/resume we check quietly and only surface the banner if there's an update.
  // Detection compares the deployed BUILD (monotonic date stamp) so it never misfires;
  // the deployed APP_VERSION is read alongside it purely to LABEL the update ("v0.2.3").
  const checkUpdate = useCallback(async (manual=false)=>{
    if(manual){ if(updTimer.current) clearTimeout(updTimer.current); setUpdMsg("Checking..."); }
    try{
      const res = await fetch(location.pathname + "?_=" + Date.now(), { cache:"no-store" });
      if(!res.ok){ logMsg("UPDATE","check http "+res.status); if(manual) flashUpd("Couldn't check - are you online?"); return; }
      const html = await res.text();
      const mb = html.match(/const BUILD = "([^"]+)";/);       const rBuild = mb && mb[1];
      const mv = html.match(/const APP_VERSION = "([^"]+)";/); const rVer = mv && mv[1];
      if(rBuild && buildIsNewer(rBuild, BUILD)){ logMsg("UPDATE","newer build live: "+rBuild+" (v"+(rVer||"?")+")"); setUpdate({ ver:rVer, build:rBuild }); if(manual) setUpdMsg(""); }
      else { logMsg("UPDATE","up to date (v"+APP_VERSION+", "+BUILD+")"); setUpdate(null); if(manual) flashUpd("You're on the latest (v"+APP_VERSION+")"); }
    }catch(e){ logMsg("UPDATE","check failed: "+e.message); if(manual) flashUpd("Update check failed"); }
  },[flashUpd]);
  // Check on launch AND on resume AND on a periodic timer - installed PWAs are usually
  // RESUMED from the background, not cold-launched, so a launch-only check means the
  // banner rarely surfaces on its own. Debounced so a burst of resumes only refetches once.
  useEffect(()=>{
    let last=0; const GAP=60*1000;
    const maybe=()=>{ const now=Date.now(); if(now-last<GAP) return; last=now; checkUpdate(false); };
    const t=setTimeout(maybe, 1200);                       // initial launch check
    const onVis=()=>{ if(document.visibilityState==="visible") maybe(); };
    document.addEventListener("visibilitychange", onVis);
    const iv=setInterval(maybe, 20*60*1000);               // periodic while open
    return ()=>{ clearTimeout(t); clearInterval(iv); document.removeEventListener("visibilitychange", onVis); };
  },[checkUpdate]);
  const doApplyUpdate = useCallback(()=> applyUpdateNav((update&&update.build)||String(Date.now())),[update]);

  // Initial data load from the backend once signed in.
  useEffect(()=>{
    if (!authed || !configComplete(cfg) || loadedOnce.current) return;  // offline mode skips backend load
    loadedOnce.current = true;
    (async ()=>{
      try {
        const next = emptyData();
        for (const name of ALL_COLLECTIONS){
          try { next[name] = await getCollection(cfg, name); } catch(e){ logMsg("WARN","load "+name+": "+e.message); }
        }
        setData(next); saveCache(next);
        initPush(cfg);
      } catch(e){ logMsg("ERROR","initial load: "+e.message); }
    })();
  },[authed]);  // eslint-disable-line

  if (!authed){
    return <AuthScreen
      onSignedIn={(c)=>{ setCfg(c); setAuthed(true); }}
      onExplore={()=>{ const c={ ...loadConfig(), offline:true, userId:"local" }; saveConfig(c); setCfg(c); setAuthed(true); }} />;
  }

  const showDeals = !!cfg.dealsEnabled;
  let screen;
  if (tab==="home") screen = <HomeView data={data}
                    onOpenContact={(id)=> setOverlay({type:"contactDetail", id})}
                    onQuickLog={quickLog} onToggleTask={toggleTask}
                    onDeleteTask={deleteTask}
                    onDismissReachOut={dismissReachOut} onDismissBirthday={dismissBirthday} />;
  else if (tab==="people") screen = <PeopleView data={data}
                    onOpenContact={(id)=> setOverlay({type:"contactDetail", id})}
                    onOpenOrg={(id)=> setOverlay({type:"orgDetail", id})}
                    onImport={()=> setOverlay({type:"import"})}
                    onDeleteContact={deleteContact} onDeleteOrg={deleteOrg} />;
  else if (tab==="deals") screen = <DealsView data={data} onOpenDeal={(id)=> setOverlay({type:"dealDetail", id})}
                    onDeleteDeal={deleteDeal} />;
  else screen = <SettingsView cfg={cfg} onCfg={applyCfg} onLogout={signOutHard}
                    onCheckUpdate={checkUpdate} updMsg={updMsg} update={update} onApplyUpdate={doApplyUpdate}
                    syncUnsent={unsent} syncPushing={pushing} onRetrySync={flushUnsent}
                    onImport={()=> setOverlay({type:"import"})}
                    onCard={()=> setOverlay({type:"card"})} />;

  // A push that has come back and left work behind = a real problem, so say so. While a
  // push is still in flight we stay quiet (every save would otherwise flash a banner).
  const syncStuck = unsent > 0 && !pushing;

  return (
    <div className="app-shell">
      <div className="bars">
        {syncStuck && (
          <button className="syncbar warn" onClick={flushUnsent}>
            <span>Changes not saved to the cloud</span>
            <span className="go">Retry</span>
          </button>
        )}
        {update && (
          <button className="syncbar" onClick={doApplyUpdate}>
            <span>Update available <b>(v{update.ver||update.build})</b></span>
            <span className="go">Refresh</span>
          </button>
        )}
      </div>
      <TopBar tab={tab} onSettings={openSettings} onBack={closeSettings} />
      <div className="content">{screen}</div>
      {toast && <div className="toast">{toast}</div>}

      {overlay && overlay.type==="add" &&
        <AddSheet onClose={()=> setOverlay(null)} dealsEnabled={showDeals}
          onContact={()=> setOverlay({type:"contactForm"})}
          onCompany={()=> setOverlay({type:"orgForm"})}
          onDeal={()=> setOverlay({type:"dealForm"})} />}

      {overlay && overlay.type==="contactForm" &&
        <ContactForm contact={overlay.contact} orgs={data.organizations||[]}
          onSave={onSaveContact}
          onClose={()=> setOverlay(overlay.contact ? {type:"contactDetail", id:overlay.contact.id} : null)} />}

      {overlay && overlay.type==="contactDetail" && (()=>{
        const c=(data.contacts||[]).find(x=> x.id===overlay.id);
        if(!c){ return null; }
        const org=(data.organizations||[]).find(o=> o.id===c.org_id);
        return <ContactDetail contact={c} org={org}
          interactions={(data.interactions||[]).filter(x=> x.contact_id===c.id)}
          tasks={(data.tasks||[]).filter(x=> x.contact_id===c.id)}
          onEdit={()=> setOverlay({type:"contactForm", contact:c})}
          onDelete={()=>{ deleteContact(c.id); setOverlay(null); }}
          onClose={()=> setOverlay(null)}
          onLogInteraction={()=> setOverlay({type:"interactionForm", contactId:c.id})}
          onDeleteInteraction={deleteInteraction}
          onAddTask={(title,due)=> addTask(c.id, title, due)}
          onToggleTask={toggleTask}
          onDeleteTask={deleteTask}
          onSummarize={()=> summarizeContact(c)}
          onDraft={()=> draftMessage(c)} />;
      })()}

      {overlay && overlay.type==="interactionForm" && (()=>{
        const c=(data.contacts||[]).find(x=> x.id===overlay.contactId);
        return <InteractionForm contactName={c && c.name} interaction={overlay.interaction}
          onSave={(form)=>{ saveInteraction(overlay.contactId, overlay.interaction, form); setOverlay({type:"contactDetail", id:overlay.contactId}); }}
          onClose={()=> setOverlay({type:"contactDetail", id:overlay.contactId})} />;
      })()}

      {overlay && overlay.type==="ai" &&
        <AIPanel title={overlay.title} run={overlay.run} onClose={()=> setOverlay(null)} />}

      {overlay && overlay.type==="import" &&
        <ImportFlow existingContacts={data.contacts||[]} onApply={applyImport} onClose={()=> setOverlay(null)} />}

      {overlay && overlay.type==="card" &&
        <CardEditor cfg={cfg} onAddLead={addLeadContact} onClose={()=> setOverlay(null)} />}

      {overlay && overlay.type==="dealForm" &&
        <DealForm deal={overlay.deal} contacts={data.contacts||[]} orgs={data.organizations||[]}
          onSave={onSaveDeal}
          onClose={()=> setOverlay(overlay.deal ? {type:"dealDetail", id:overlay.deal.id} : null)} />}

      {overlay && overlay.type==="dealDetail" && (()=>{
        const d=(data.deals||[]).find(x=> x.id===overlay.id);
        if(!d){ return null; }
        const contact=(data.contacts||[]).find(c=> c.id===d.contact_id);
        const org=(data.organizations||[]).find(o=> o.id===d.org_id);
        return <DealDetail deal={d} contact={contact} org={org}
          onEdit={()=> setOverlay({type:"dealForm", deal:d})}
          onDelete={()=>{ deleteDeal(d.id); setOverlay(null); }}
          onStage={(s)=> setDealStage(d.id, s)}
          onOpenContact={(id)=> setOverlay({type:"contactDetail", id})}
          onOpenOrg={(id)=> setOverlay({type:"orgDetail", id})}
          onClose={()=> setOverlay(null)} />;
      })()}

      {overlay && overlay.type==="orgForm" &&
        <OrgForm org={overlay.org} onSave={onSaveOrg}
          onClose={()=> setOverlay(overlay.org ? {type:"orgDetail", id:overlay.org.id} : null)} />}

      {overlay && overlay.type==="orgDetail" && (()=>{
        const o=(data.organizations||[]).find(x=> x.id===overlay.id);
        if(!o){ return null; }
        return <OrgDetail org={o} contacts={(data.contacts||[]).filter(c=> c.org_id===o.id)}
          onEdit={()=> setOverlay({type:"orgForm", org:o})}
          onDelete={()=>{ deleteOrg(o.id); setOverlay(null); }}
          onOpenContact={(id)=> setOverlay({type:"contactDetail", id})}
          onDeleteContact={deleteContact}
          onClose={()=> setOverlay(null)} />;
      })()}
      <nav className="nav">
        <button className={tab==="home"?"on":""} onClick={()=>setTab("home")}><Icon name="home"/>Home</button>
        <button className={tab==="people"?"on":""} onClick={()=>setTab("people")}><Icon name="people"/>People</button>
        <button onClick={()=> setOverlay({type:"add"})}><span className="add"><Icon name="plus"/></span></button>
        {showDeals &&
          <button className={tab==="deals"?"on":""} onClick={()=>setTab("deals")}><Icon name="deals"/>Deals</button>}
      </nav>
    </div>
  );
}

// Route: a `?card=<slug>` link renders the PUBLIC card page (no login); otherwise the app.
const _cardSlug = new URLSearchParams(location.search).get("card");
ReactDOM.createRoot(document.getElementById("root")).render(_cardSlug ? <PublicCard slug={_cardSlug} /> : <App />);
  </script>
</body>
</html>
